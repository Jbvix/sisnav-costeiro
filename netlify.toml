# =============================================================================
# SISNAV COSTEIRO - netlify.toml (front-end estático)
# Autor: Jossian Brito (Charlie Bravo) | Assistido por Claude
# Data/Hora: 2026-10-30 18:14 (UTC-3)   Versão: 1.1 (v3.8.2)
# -----------------------------------------------------------------------------
# HISTÓRICO DE MODIFICAÇÕES
#  1.1 (v3.8.2) - Proxy /api/* -> Railway. A regra NÃO fica aqui: é gerada em
#                 dist/_redirects por scripts/build_netlify.sh a partir de
#                 SISNAV_API_BASE (endereço do Railway num só lugar).
#  1.0 (v3.6.0-cloud) - Versão inicial.
# -----------------------------------------------------------------------------
# O Netlify serve só o casco (HTML/JS/CSS). O motor (Flask) roda no Railway.
# Defina SISNAV_API_BASE no painel do Netlify (Site configuration > Environment
# variables) com a URL pública do Railway, ex.: https://sisnav-api.up.railway.app
# =============================================================================
[build]
  command = "bash scripts/build_netlify.sh"
  publish = "dist"

# Página inicial: o app exige sessão; protected_route.js redireciona ao login.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Dados que mudam com frequência: nunca guardar em cache
[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
