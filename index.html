<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISNAV Costeiro - V3.1 Modular</title>
    
    <!-- CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- CSS customizado -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white font-sans overflow-hidden">
    <!-- Camada de Proteção/Login -->
    <div id="protection-layer" class="fixed inset-0 z-[9999] bg-gray-900 flex items-center justify-center hidden">
        <div class="bg-gray-800 p-8 rounded-lg shadow-2xl border border-gray-700 w-full max-w-md text-center">
            <h1 class="text-2xl font-bold mb-6 text-blue-400 font-serif lowercase italic">SISNAV</h1>
            <p class="mb-4 text-gray-400">Insira o código de acesso para continuar</p>
            <input type="password" id="invite-code" class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 mb-4 text-center focus:border-blue-500 outline-none" placeholder="Código">
            <button id="btn-validate" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold transition">Acessar Sistema</button>
            <p id="auth-error" class="text-red-500 mt-2 text-sm hidden">Código inválido</p>
            <p class="mt-6 text-xs text-gray-500">© 2025 TugLife - Todos os direitos reservados</p>
        </div>
    </div>

    <!-- Container Principal do App -->
    <div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-500">
        <!-- Dashboard / Layout principal aqui -->
        <!-- O conteúdo é injetado pelos módulos via App.js -->
    </div>

    <!-- Bibliotecas Externas -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <!-- App Entry Point -->
    <script type="module" src="js/App.js"></script>
</body>
</html>
