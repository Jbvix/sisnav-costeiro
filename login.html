<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISNAV Costeiro - Acesso Seguro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Premium Feel -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #020617;
            /* Slate 950 */
            /* Topographic / Bathymetric Pattern */
            background-image:
                linear-gradient(to bottom, rgba(15, 23, 42, 0.8), rgba(2, 6, 23, 1)),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%231e293b' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E");
            font-family: 'Outfit', sans-serif;
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-premium {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            transition: all 0.3s ease;
        }

        .input-premium:focus {
            border-color: #22d3ee;
            /* Cyan 400 */
            box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        /* Pulse Animation for Logo */
        @keyframes slow-pulse {

            0%,
            100% {
                opacity: 0.8;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(0.95);
            }
        }

        .animate-radar {
            animation: slow-pulse 3s infinite ease-in-out;
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="flex items-center justify-center h-screen overflow-hidden selection:bg-cyan-500 selection:text-white">

    <!-- Ambient Glow -->
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-cyan-900/20 rounded-full blur-[100px] pointer-events-none">
    </div>

    <div class="glass-card p-10 rounded-3xl w-full max-w-sm text-center relative z-10 fade-in">

        <!-- Logo Section -->
        <div class="mb-8 relative inline-block">
            <div class="absolute -inset-4 bg-cyan-500/10 rounded-full blur-xl animate-radar"></div>
            <div
                class="relative bg-gradient-to-br from-slate-800 to-slate-900 p-4 rounded-2xl border border-slate-700 shadow-xl inline-flex items-center justify-center mb-4">
                <i class="fas fa-location-crosshairs text-3xl text-cyan-400"></i>
            </div>

            <h1 class="text-2xl font-bold tracking-[0.2em] text-white">SISNAV</h1>
            <p class="text-[10px] text-cyan-400 font-bold uppercase tracking-[0.4em] mt-1 ml-1">Costeiro</p>
        </div>

        <div id="content-area" class="min-h-[160px] flex flex-col justify-center transition-all duration-500">

            <!-- 1. LOADING STATE -->
            <div id="loading-state" class="py-4">
                <div class="flex flex-col items-center gap-4">
                    <!-- Nautical Dot Loading -->
                    <div
                        class="flex items-center justify-center w-6 h-6 bg-transparent rounded-full border border-cyan-500/50 relative animate-spin">
                        <div class="w-2 h-2 bg-cyan-400 rounded-full"></div>
                    </div>
                    <p class="text-xs text-slate-400 tracking-wide animate-pulse">Autenticando Convite...</p>
                </div>
            </div>

            <!-- 2. LOGIN FORM -->
            <form id="login-form" class="hidden text-left w-full space-y-4 opacity-0 transition-opacity duration-500">

                <div class="text-center mb-2">
                    <p class="text-xs text-slate-400">Olá! Digite sua credencial para acessar.</p>
                </div>

                <div class="space-y-1">
                    <label class="block text-[10px] uppercase font-bold text-slate-500 tracking-wider ml-1">Senha de
                        Acesso</label>
                    <div class="relative group">
                        <span
                            class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500 group-focus-within:text-cyan-400 transition-colors">
                            <i class="fas fa-lock text-xs"></i>
                        </span>
                        <input type="password" id="inp-password"
                            class="input-premium block w-full pl-9 pr-3 py-3 text-white placeholder-slate-600 rounded-xl text-sm focus:outline-none focus:ring-0"
                            placeholder="Chave do Convite" required autocomplete="off">
                    </div>
                </div>

                <button type="submit" id="btn-access"
                    class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-cyan-900/40 transform transition hover:-translate-y-0.5 active:translate-y-0 text-sm tracking-wide">
                    ACESSAR SISTEMA
                </button>
            </form>

            <!-- 3. ERROR STATE -->
            <div id="error-state" class="hidden py-2 text-center">
                <div
                    class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-red-900/30 text-red-500 mb-3 border border-red-500/20">
                    <i class="fas fa-shield-halved text-xl"></i>
                </div>
                <h2 class="text-lg font-bold text-red-400 mb-1">Acesso Negado</h2>
                <p id="error-msg" class="text-xs text-slate-400 mb-4 px-4 leading-relaxed">Token inválido.</p>
                <a href="mailto:suporte@sisnav.com"
                    class="text-[10px] text-slate-500 hover:text-white border-b border-slate-700 hover:border-white pb-0.5 transition-colors">
                    Solicitar Suporte
                </a>
            </div>

        </div>

    </div>

    <!-- Footer -->
    <footer class="absolute bottom-6 w-full text-center">
        <p class="text-[10px] text-slate-600 font-mono">
            &copy; 2026 SISNAV Systems<br>
            <span class="opacity-50">Secure Enclave v4.0</span>
        </p>
    </footer>

    <!-- Logic -->
    <script type="module">
        import AuthService from './js/services/AuthService.js?v=Hotfix4';

        // Init Logic
        AuthService.init();

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        // DOM Elements
        const elLoading = document.getElementById('loading-state');
        const elForm = document.getElementById('login-form');
        const elError = document.getElementById('error-state');
        const elErrorMsg = document.getElementById('error-msg');
        const inpPass = document.getElementById('inp-password');
        const btnAccess = document.getElementById('btn-access');

        // Initial Delay for "Authentication" feel
        setTimeout(() => {
            elLoading.classList.add('hidden');

            if (!token) {
                showError("Link de convite inválido ou ausente. Verifique seu e-mail.");
                return;
            }

            // Optional: Check if invite exists locally first before showing pass field
            // But AuthService.login handles full check. 
            // Here we just check non-empty string as a basic gate.

            showForm();
        }, 1200);

        function showForm() {
            elForm.classList.remove('hidden');
            // Trigger reflow/anim
            requestAnimationFrame(() => {
                elForm.classList.remove('opacity-0');
                inpPass.focus();
            });
        }

        function showError(msg) {
            elLoading.classList.add('hidden');
            elForm.classList.add('hidden');
            elError.classList.remove('hidden');
            elErrorMsg.innerText = msg;
        }

        // Handle Login
        elForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Loading on Button
            const originalBtn = btnAccess.innerHTML;
            btnAccess.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            btnAccess.disabled = true;
            btnAccess.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                const pass = inpPass.value;
                const result = await AuthService.login(token, pass);

                if (result.success) {
                    btnAccess.innerHTML = '<i class="fas fa-check"></i> SUCESSO';
                    btnAccess.classList.replace('from-cyan-600', 'from-green-600');
                    btnAccess.classList.replace('to-blue-600', 'to-green-500');

                    // Smooth Redirect
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    throw new Error(result.error);
                }
            } catch (err) {
                // Reset Button
                btnAccess.innerHTML = originalBtn;
                btnAccess.disabled = false;
                btnAccess.classList.remove('opacity-75', 'cursor-not-allowed');

                // Show Feedback
                alert(err.message || 'Erro de conexão.');
                inpPass.value = '';
                inpPass.focus();
                inpPass.classList.add('border-red-500');
                setTimeout(() => inpPass.classList.remove('border-red-500'), 1000);
            }
        });

    </script>
</body>

</html>
